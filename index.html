<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
  <meta name="theme-color" content="#080c14"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <title>حاسبة الاستثمار الشخصية</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet"/>
  <style>
    *{box-sizing:border-box;margin:0;padding:0;}
    html,body{background:#080c14;min-height:100vh;overflow-x:hidden;}
    input[type=range]{-webkit-appearance:none;appearance:none;}
    input[type=number]{-moz-appearance:textfield;}
    input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;}
    ::-webkit-scrollbar{width:3px;height:3px;}
    ::-webkit-scrollbar-track{background:#080c14;}
    ::-webkit-scrollbar-thumb{background:#182033;border-radius:4px;}
    @keyframes fadeUp{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
    @keyframes ping{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.5);opacity:0.4}}
    .cal-row:hover{background:rgba(245,166,35,0.025)!important;}
    select,input{-webkit-appearance:none;}
    /* Mobile responsive */
    @media(max-width:700px){
      .main-grid{grid-template-columns:1fr!important;}
      .stat-grid{grid-template-columns:1fr 1fr!important;}
      .spark-grid{grid-template-columns:1fr!important;}
    }
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const{useState,useMemo,useCallback,useEffect}=React;

const fmtEGP=(n)=>"ج.م "+new Intl.NumberFormat("en-US",{maximumFractionDigits:0}).format(Math.round(Math.abs(n)));
const MONTHS_EN=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const C={bg:"#080c14",card:"#0d1220",border:"#182033",accent:"#f5a623",green:"#27ae60",blue:"#2980e8",purple:"#8e44ad",red:"#c0392b",teal:"#16a085",text:"#dde3ef",muted:"#3d4f6a",sub:"#7a8fa8"};

function absToDate(i){const t=3+i;return{year:2026+Math.floor(t/12),month:((t%12)+12)%12};}

// Default circle amounts (index = circle number in sequence)
const DEFAULT_BIG_AMOUNTS=Array.from({length:50},(_,i)=>i<4?2000:i<8?2500:3000);
const DEFAULT_SMALL_AMOUNTS=Array.from({length:50},(_,i)=>i<3?1000:i<7?2000:2500);

function buildCircleSchedule(horizonMonths,bigAmounts,smallAmounts){
  const PAYOUT_SLOT=4,DURATION=6;
  const result=[];
  // Build index maps: for each circle start absIdx → contribution amount
  const bigCircleMap={};
  let bi=0;
  for(let start=-2;start<horizonMonths;start+=2){bigCircleMap[start]=bigAmounts[bi]||bigAmounts[bigAmounts.length-1];bi++;}
  const smallCircleMap={};
  let si=0;
  for(let start=1;start<horizonMonths;start+=2){smallCircleMap[start]=smallAmounts[si]||smallAmounts[smallAmounts.length-1];si++;}

  for(let i=0;i<horizonMonths;i++){
    let bigWage=0,bigPayout=0,smallWage=0,smallPayout=0;
    for(let start=-2;start<=i;start+=2){
      const m=i-start+1;
      const amt=bigCircleMap[start]||2000;
      if(m>=1&&m<=DURATION){
        if(m===PAYOUT_SLOT)bigPayout+=amt*5; // payout = amt × 5
        else bigWage+=amt;
      }
    }
    for(let start=1;start<=i;start+=2){
      const m=i-start+1;
      const amt=smallCircleMap[start]||1000;
      if(m>=1&&m<=DURATION){
        if(m===PAYOUT_SLOT)smallPayout+=amt*5;
        else smallWage+=amt;
      }
    }
    result.push({absIdx:i,bigWage,bigPayout,smallWage,smallPayout});
  }
  return result;
}

function getBoostAt(timeline,absIdx){
  let val=0;
  for(const p of timeline){if(p.absIdx<=absIdx)val=p.amount;else break;}
  return val;
}

const USD_PAYOUTS=new Set();
for(let p=0;p<=12;p++){USD_PAYOUTS.add(2+p*20);USD_PAYOUTS.add(3+p*20);}

function simulate({initialFund=40000,annualReturn,inflation,usdRate,bigBoostTimeline,smallBoostTimeline,manualDeposits=[],withdrawalTimeline=[],bigCircleAmounts,smallCircleAmounts,horizonMonths}){
  const mRate=annualReturn/100/12,mInfl=inflation/100/12;
  const schedule=buildCircleSchedule(horizonMonths,bigCircleAmounts||DEFAULT_BIG_AMOUNTS,smallCircleAmounts||DEFAULT_SMALL_AMOUNTS);
  let balance=initialFund,totalDeposited=initialFund,inflBase=1;
  const rows=[];
  for(let i=0;i<horizonMonths;i++){
    const{year,month}=absToDate(i);
    const{bigWage:bigWageBase,bigPayout,smallWage:smallWageBase,smallPayout}=schedule[i];

    const bigBoost=getBoostAt(bigBoostTimeline,i);
    const smallBoost=getBoostAt(smallBoostTimeline,i);
    const withdrawalPoint=withdrawalTimeline.slice().reverse().find(p=>p.absIdx<=i)||null;
    const withdrawalPct=withdrawalPoint&&withdrawalPoint.mode==="pct"?withdrawalPoint.amount:0;
    const withdrawalAmt=withdrawalPoint&&withdrawalPoint.mode==="egp"?withdrawalPoint.amount:0;

    const bigTotalObligation=bigWageBase+(bigPayout>0?2000:0);
    const smallTotalObligation=smallWageBase+(smallPayout>0?1000:0);
    const bigFundDrain=Math.min(bigBoost,bigTotalObligation);
    const smallFundDrain=Math.min(smallBoost,smallTotalObligation);
    const totalFundDrain=Math.min(bigFundDrain+smallFundDrain,balance*0.2);

    const bigWageActual=Math.max(0,bigWageBase-Math.min(bigFundDrain,bigWageBase));
    const smallWageActual=Math.max(0,smallWageBase-Math.min(smallFundDrain,smallWageBase));

    // Payout uses the circle's actual amount (from schedule) based on circle start month
    // Circle that pays at absIdx i started at i-3 (slot 4 of 6)
    // Big circles start at -2,0,2,4... → circle index = (startAbsIdx+2)/2
    const bigStartAbsIdx=i-3;
    const bigCircleIdx=Math.floor((bigStartAbsIdx+2)/2);
    const bigCircleAmt=bigCircleIdx>=0?(bigCircleAmounts[bigCircleIdx]||2000):2000;
    const smallStartAbsIdx=i-3;
    const smallCircleIdx=Math.floor((smallStartAbsIdx-1)/2);
    const smallCircleAmt=smallCircleIdx>=0?(smallCircleAmounts[smallCircleIdx]||1000):1000;
    const bigPayoutBoosted=bigPayout>0?bigCircleAmt*5:0;
    const smallPayoutBoosted=smallPayout>0?smallCircleAmt*5:0;

    // 1. Fund compounds first
    const returnAmt=balance*mRate;
    balance+=returnAmt;

    // 2. Withdraw from return — either fixed EGP or % of return
    const returnWithdrawn=withdrawalPoint
      ? withdrawalPoint.mode==="pct"
        ? Math.min(returnAmt*(withdrawalPoint.amount/100), returnAmt)
        : Math.min(withdrawalPoint.amount, returnAmt)
      : 0;
    const withdrawalDisplay=withdrawalPoint
      ? withdrawalPoint.mode==="pct"
        ? `${withdrawalPoint.amount}%`
        : fmtEGP(withdrawalPoint.amount)
      : "0";
    balance-=returnWithdrawn;

    // 3. Drain circle boosts
    balance-=totalFundDrain;

    const usdIn=USD_PAYOUTS.has(i)?2000*usdRate:0;
    const manualIn=manualDeposits.filter(d=>d.absIdx===i).reduce((s,d)=>s+d.egpAmount,0);
    const totalIn=bigPayoutBoosted+smallPayoutBoosted+usdIn+manualIn;
    balance+=totalIn;totalDeposited+=totalIn;
    inflBase*=(1+mInfl);
    rows.push({
      absIdx:i,year,month,balance,
      realValue:balance/inflBase,
      returnAmt,returnWithdrawn,withdrawalDisplay,
      withdrawalPct:withdrawalPoint?.mode==="pct"?withdrawalPoint.amount:0,
      totalFundDrain,
      bigWage:bigWageActual,bigFund:bigFundDrain,
      smallWage:smallWageActual,smallFund:smallFundDrain,
      bigPayout:bigPayoutBoosted,smallPayout:smallPayoutBoosted,
      usdIn,manualIn,totalIn,totalDeposited,
      gain:balance-totalDeposited
    });
  }
  return rows;
}

function Sparkline({data,color}){
  if(!data||data.length<2)return null;
  const max=Math.max(...data),min=Math.min(...data),range=max-min||1;
  const W=200,H=44;
  const pts=data.map((v,i)=>`${(i/(data.length-1))*W},${H-((v-min)/range)*H}`).join(" ");
  const id=`sg${color.replace(/[^a-z0-9]/gi,"")}`;
  return(<svg viewBox={`0 0 ${W} ${H}`} style={{width:"100%",height:44}}>
    <defs><linearGradient id={id} x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stopColor={color} stopOpacity="0.3"/>
      <stop offset="100%" stopColor={color} stopOpacity="0"/>
    </linearGradient></defs>
    <polygon points={`0,${H} ${pts} ${W},${H}`} fill={`url(#${id})`}/>
    <polyline points={pts} fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/>
  </svg>);
}

function Slider({label,value,min,max,step,onChange,fmt,color=C.accent}){
  const pct=((value-min)/(max-min))*100;
  return(<div style={{marginBottom:"1.1rem"}}>
    <div style={{display:"flex",justifyContent:"space-between",marginBottom:"0.25rem"}}>
      <span style={{fontSize:"0.73rem",color:C.sub}}>{label}</span>
      <span style={{fontSize:"0.88rem",fontWeight:700,color,fontFamily:"monospace"}}>{fmt(value)}</span>
    </div>
    <div style={{position:"relative",height:5,background:C.border,borderRadius:99}}>
      <div style={{position:"absolute",left:0,top:0,height:"100%",width:`${pct}%`,background:color,borderRadius:99}}/>
      <input type="range" min={min} max={max} step={step} value={value}
        onChange={e=>onChange(Number(e.target.value))}
        style={{position:"absolute",inset:0,width:"100%",opacity:0,cursor:"pointer",height:"100%",margin:0}}/>
    </div>
  </div>);
}

function StatCard({label,value,sub,color=C.accent,icon}){
  return(<div style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:13,padding:"0.9rem 1.1rem",borderTop:`2px solid ${color}`}}>
    <div style={{fontSize:"0.62rem",color:C.muted,textTransform:"uppercase",letterSpacing:"0.1em",marginBottom:"0.25rem"}}>{icon} {label}</div>
    <div style={{fontSize:"1.15rem",fontWeight:800,color:C.text,fontFamily:"monospace",lineHeight:1.2}}>{value}</div>
    {sub&&<div style={{fontSize:"0.65rem",color:C.sub,marginTop:"0.2rem"}}>{sub}</div>}
  </div>);
}

function BoostTimeline({label,color,timeline,onChange,maxBoost,horizonMonths}){
  const[selMonth,setSelMonth]=useState(0);
  const[selAmount,setSelAmount]=useState(0);
  const[boostError,setBoostError]=useState("");
  const addPoint=()=>{
    const cur=getBoostAt(timeline,selMonth);
    if(selAmount===cur){setBoostError(`Already at ج.م ${selAmount.toLocaleString()}/mo — change amount to update.`);return;}
    setBoostError("");
    const updated=[...timeline.filter(p=>p.absIdx!==selMonth),{absIdx:selMonth,amount:selAmount}].sort((a,b)=>a.absIdx-b.absIdx);
    onChange(updated);
  };
  const remove=(idx)=>onChange(timeline.filter(p=>p.absIdx!==idx));
  const monthOptions=Array.from({length:horizonMonths},(_,i)=>{const{year,month}=absToDate(i);return{absIdx:i,label:`${MONTHS_EN[month]} ${year}`};});
  return(<div style={{background:"#070b12",border:`1px solid ${color}20`,borderRadius:11,padding:"0.9rem",marginBottom:"0.8rem"}}>
    <div style={{fontSize:"0.75rem",fontWeight:700,color,marginBottom:"0.7rem"}}>{label}</div>
    {timeline.length===0&&<div style={{fontSize:"0.68rem",color:C.muted,marginBottom:"0.6rem",fontStyle:"italic"}}>No boost — fully from wages</div>}
    {timeline.map(p=>{
      const{year,month}=absToDate(p.absIdx);
      const ni=timeline.findIndex(x=>x.absIdx>p.absIdx);
      const np=ni>=0?timeline[ni]:null;
      const until=np?(()=>{const d=absToDate(np.absIdx-1);return`${MONTHS_EN[d.month]} ${d.year}`;})():"onwards";
      return(<div key={p.absIdx} style={{display:"flex",alignItems:"center",gap:"0.4rem",marginBottom:"0.35rem",background:`${color}0e`,borderRadius:7,padding:"0.38rem 0.65rem"}}>
        <div style={{flex:1}}>
          <span style={{fontSize:"0.7rem",color:C.sub}}>From </span>
          <span style={{fontSize:"0.72rem",color:C.text,fontWeight:700}}>{MONTHS_EN[month]} {year}</span>
          <span style={{fontSize:"0.68rem",color:C.muted}}> → {until}</span>
        </div>
        <span style={{fontSize:"0.75rem",color,fontFamily:"monospace",fontWeight:700}}>+{fmtEGP(p.amount)}/mo</span>
        <button onClick={()=>remove(p.absIdx)} style={{background:"none",border:"none",color:C.red,cursor:"pointer",fontSize:"0.78rem",padding:"0 0.15rem"}}>✕</button>
      </div>);
    })}
    <div style={{display:"flex",gap:"0.4rem",marginTop:"0.6rem",flexWrap:"wrap"}}>
      <select value={selMonth} onChange={e=>{setSelMonth(Number(e.target.value));setBoostError("");}}
        style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:7,color:C.text,padding:"0.4rem",fontSize:"0.72rem",fontFamily:"inherit",flex:"1 1 90px",minWidth:0}}>
        {monthOptions.map(o=><option key={o.absIdx} value={o.absIdx}>{o.label}</option>)}
      </select>
      <input type="number" value={selAmount} min={0} max={maxBoost} step={100}
        onChange={e=>{setSelAmount(Number(e.target.value));setBoostError("");}}
        style={{background:C.card,border:`1px solid ${boostError?C.red:C.border}`,borderRadius:7,color:C.text,padding:"0.4rem",fontSize:"0.72rem",fontFamily:"monospace",flex:"1 1 80px",minWidth:0,outline:"none"}}/>
      <button onClick={addPoint} style={{background:`${color}18`,border:`1px solid ${color}45`,borderRadius:7,color,padding:"0.3rem 0.7rem",fontSize:"0.72rem",cursor:"pointer",fontFamily:"inherit",fontWeight:700}}>+ Set</button>
    </div>
    {boostError&&<div style={{fontSize:"0.65rem",color:C.red,marginTop:"0.35rem"}}>⚠️ {boostError}</div>}
    <div style={{fontSize:"0.62rem",color:C.muted,marginTop:"0.3rem"}}>
      Active: <span style={{color,fontFamily:"monospace",fontWeight:700}}>ج.م {getBoostAt(timeline,selMonth).toLocaleString()}/mo</span> · max {fmtEGP(maxBoost)}/mo
    </div>
  </div>);
}

const BIG_JOIN_MONTHS=new Set([1,3,5,7,9,11]);
const SMALL_JOIN_MONTHS=new Set([4,6,8,10,0,2]);

// unique key per alert: "big-absIdx" or "small-absIdx"
function alertKey(type,absIdx){return`${type}-${absIdx}`;}

function AlertPanel({horizonMonths,bigBoostTimeline,smallBoostTimeline,bigCircleAmounts,smallCircleAmounts}){
  const today=new Date();
  const todayAbs=(today.getFullYear()-2026)*12+today.getMonth()-3;

  const[joined,setJoined]=useState(()=>{
    try{const s=localStorage.getItem("inv_joined");return s?new Set(JSON.parse(s)):new Set();}
    catch{return new Set();}
  });

  const tick=(key)=>{setJoined(prev=>{const next=new Set(prev);next.add(key);try{localStorage.setItem("inv_joined",JSON.stringify([...next]));}catch{}return next;});};
  const untick=(key)=>{setJoined(prev=>{const next=new Set(prev);next.delete(key);try{localStorage.setItem("inv_joined",JSON.stringify([...next]));}catch{}return next;});};

  const alerts=[];
  for(let i=Math.max(0,todayAbs);i<horizonMonths;i++){
    const{year,month}=absToDate(i);
    const isCurrent=i===todayAbs,isNext=i===todayAbs+1,monthsAway=i-todayAbs;

    if(BIG_JOIN_MONTHS.has(month)){
      const key=alertKey("big",i);
      // Get the circle amount for this circle from the schedule
      const bigCircleIdx=Math.floor((i+2)/2);
      const bigContrib=bigCircleAmounts[bigCircleIdx]||2000;
      const bigPayout=bigContrib*5;
      const payoutDate=absToDate(i+3);
      alerts.push({
        absIdx:i,year,month,type:"big",
        label:"Big EGP Circle",color:C.blue,icon:"🔵",
        contrib:`ج.م ${bigContrib.toLocaleString()}/mo`,
        payout:fmtEGP(bigPayout),
        payoutMonth:`${MONTHS_EN[payoutDate.month]} ${payoutDate.year}`,
        boosted:false,
        isCurrent,isNext,monthsAway,key,done:joined.has(key)
      });
    }
    if(SMALL_JOIN_MONTHS.has(month)&&i>=1){
      const key=alertKey("small",i);
      const smallCircleIdx=Math.floor((i-1)/2);
      const smallContrib=smallCircleAmounts[smallCircleIdx]||1000;
      const smallPayout=smallContrib*5;
      const payoutDate=absToDate(i+3);
      alerts.push({
        absIdx:i,year,month,type:"small",
        label:"Small EGP Circle",color:C.green,icon:"🟢",
        contrib:`ج.م ${smallContrib.toLocaleString()}/mo`,
        payout:fmtEGP(smallPayout),
        payoutMonth:`${MONTHS_EN[payoutDate.month]} ${payoutDate.year}`,
        boosted:false,
        isCurrent,isNext,monthsAway,key,done:joined.has(key)
      });
    }
  }
  alerts.sort((a,b)=>a.absIdx-b.absIdx);

  const curr=alerts.filter(a=>a.isCurrent&&!a.done);
  const next=alerts.filter(a=>a.isNext&&!a.done);
  const upcoming=alerts.filter(a=>!a.isCurrent&&!a.isNext&&a.monthsAway<=12&&!a.done);
  const doneAlerts=alerts.filter(a=>a.done);

  const TickBtn=({a})=>(
    <button onClick={()=>tick(a.key)}
      style={{display:"flex",alignItems:"center",gap:"0.3rem",background:`${C.green}18`,border:`1px solid ${C.green}40`,borderRadius:7,color:C.green,padding:"0.25rem 0.6rem",cursor:"pointer",fontFamily:"inherit",fontSize:"0.7rem",fontWeight:700,flexShrink:0}}>
      ✓ Joined
    </button>
  );

  return(<div style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:15,padding:"1.1rem",marginBottom:"0.8rem"}}>
    <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:"0.7rem"}}>
      <div style={{fontSize:"0.65rem",color:C.muted,textTransform:"uppercase",letterSpacing:"0.1em"}}>🔔 Circle Join Alerts</div>
      {doneAlerts.length>0&&<span style={{fontSize:"0.62rem",color:C.green}}>✓ {doneAlerts.length} joined</span>}
    </div>
    <div style={{fontSize:"0.68rem",color:C.sub,marginBottom:"0.8rem"}}>Today: <span style={{color:C.text,fontWeight:700}}>{MONTHS_EN[today.getMonth()]} {today.getFullYear()}</span></div>

    {/* THIS MONTH */}
    {curr.length>0&&(<div style={{marginBottom:"1rem"}}>
      <div style={{fontSize:"0.68rem",color:C.accent,fontWeight:700,marginBottom:"0.5rem",display:"flex",alignItems:"center",gap:"0.4rem"}}>
        <span style={{display:"inline-block",width:8,height:8,borderRadius:"50%",background:C.accent,animation:"ping 1.5s infinite"}}/>ACTION NEEDED THIS MONTH
      </div>
      {curr.map((a,i)=>(<div key={i} style={{background:`${a.color}15`,border:`1px solid ${a.color}40`,borderRadius:10,padding:"0.7rem 0.9rem",marginBottom:"0.4rem"}}>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",gap:"0.5rem",marginBottom:"0.3rem"}}>
          <div style={{display:"flex",alignItems:"center",gap:"0.5rem"}}>
            <span style={{fontSize:"1rem"}}>{a.icon}</span>
            <div>
              <span style={{fontSize:"0.82rem",fontWeight:800,color:a.color}}>Join {a.label} Now!</span>
              {a.boosted&&<span style={{fontSize:"0.62rem",background:`${C.accent}20`,border:`1px solid ${C.accent}40`,borderRadius:4,padding:"0.1rem 0.4rem",color:C.accent,marginLeft:"0.4rem"}}>⚡ Boosted</span>}
            </div>
          </div>
          <TickBtn a={a}/>
        </div>
        <div style={{fontSize:"0.7rem",color:C.sub}}>
          Contribute <span style={{color:C.text,fontWeight:700}}>{a.contrib}</span> · Collect <span style={{color:C.green,fontWeight:700}}>{a.payout}</span> in <span style={{color:C.accent,fontWeight:700}}>{a.payoutMonth}</span>
        </div>
      </div>))}
    </div>)}

    {/* NEXT MONTH */}
    {next.length>0&&(<div style={{marginBottom:"1rem"}}>
      <div style={{fontSize:"0.67rem",color:C.purple,fontWeight:700,marginBottom:"0.5rem"}}>⏰ NEXT MONTH</div>
      {next.map((a,i)=>(<div key={i} style={{background:`${a.color}0c`,border:`1px solid ${a.color}28`,borderRadius:10,padding:"0.65rem 0.9rem",marginBottom:"0.4rem"}}>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",gap:"0.5rem"}}>
          <div style={{display:"flex",alignItems:"center",gap:"0.45rem"}}>
            <span>{a.icon}</span><span style={{fontSize:"0.78rem",fontWeight:700,color:C.text}}>Join {a.label}</span>
          </div>
          <div style={{display:"flex",alignItems:"center",gap:"0.5rem"}}>
            <span style={{fontSize:"0.68rem",color:C.purple,fontFamily:"monospace",fontWeight:700}}>{MONTHS_EN[a.month]} {a.year}</span>
            <TickBtn a={a}/>
          </div>
        </div>
        <div style={{fontSize:"0.68rem",color:C.sub,marginTop:"0.2rem"}}>{a.contrib} · payout {a.payout}</div>
      </div>))}
    </div>)}

    {/* UPCOMING */}
    {upcoming.length>0&&(<div>
      <div style={{fontSize:"0.67rem",color:C.muted,fontWeight:700,marginBottom:"0.5rem",textTransform:"uppercase",letterSpacing:"0.08em"}}>📅 Upcoming (12 months)</div>
      <div style={{maxHeight:200,overflowY:"auto"}}>
        {upcoming.map((a,i)=>(<div key={i} style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"0.35rem 0.5rem",borderRadius:7,marginBottom:"0.25rem",background:i%2===0?"rgba(255,255,255,0.015)":"transparent",gap:"0.4rem"}}>
          <div style={{display:"flex",alignItems:"center",gap:"0.4rem",flex:1,minWidth:0}}>
            <span style={{fontSize:"0.8rem"}}>{a.icon}</span>
            <div style={{minWidth:0}}>

function generateRecommendations(goal, rows, annualReturn, bigBoostTimeline, smallBoostTimeline, inflation, horizonMonths){
  const recs=[];
  const deadlineRow=rows[goal.deadlineAbsIdx];
  const balanceAtDeadline=deadlineRow?deadlineRow.balance:0;
  const gap=goal.target-balanceAtDeadline;
  const hitIdx=rows.findIndex(r=>r.balance>=goal.target);
  const monthsLeft=goal.deadlineAbsIdx;
  const inflationFactor=Math.pow(1+inflation/100,monthsLeft/12);
  const realValue=goal.target/inflationFactor;

  // 1. When will you hit the goal?
  if(hitIdx>=0){
    const{year,month}=absToDate(hitIdx);
    if(hitIdx<=goal.deadlineAbsIdx){
      const monthsEarly=goal.deadlineAbsIdx-hitIdx;
      recs.push({type:"success",icon:"🎯",text:`You'll hit this goal in ${MONTHS_EN[month]} ${year} — ${monthsEarly} month${monthsEarly!==1?"s":""} ahead of deadline!`});
    } else {
      const monthsLate=hitIdx-goal.deadlineAbsIdx;
      recs.push({type:"warning",icon:"⏰",text:`At current pace you'll reach this in ${MONTHS_EN[month]} ${year} — ${monthsLate} month${monthsLate!==1?"s":""} after deadline.`});
    }
  } else {
    recs.push({type:"danger",icon:"❌",text:`You won't reach ${fmtEGP(goal.target)} within your ${horizonMonths} month horizon at current settings.`});
  }

  // 2. Gap analysis
  if(gap>0){
    recs.push({type:"info",icon:"📊",text:`You need ${fmtEGP(gap)} more by your deadline. That's ${fmtEGP(gap/Math.max(monthsLeft,1))} extra per month on average.`});
  }

  // 3. Inflation note
  recs.push({type:"info",icon:"📉",text:`In today's purchasing power, ${fmtEGP(goal.target)} is worth ${fmtEGP(realValue)} — inflation eats ${fmtEGP(goal.target-realValue)} over ${(monthsLeft/12).toFixed(1)} years.`});

  // 4. Big circle boost recommendation
  if(gap>0){
    const currentBigBoost=getBoostAt(bigBoostTimeline,0);
    const tryBoost=currentBigBoost+500;
    // Simulate with extra boost: rough estimate — each 500 boost adds ~500*5=2500 per big payout, ~6 payouts/year
    const extraPerYear=2500*6;
    const extraTotal=extraPerYear*(monthsLeft/12);
    if(extraTotal>0){
      recs.push({type:"action",icon:"🔵",text:`Boosting Big Circle by ج.م 500/mo more from now adds ~${fmtEGP(extraTotal)} by deadline — closing ${Math.min(100,Math.round(extraTotal/Math.max(gap,1)*100))}% of the gap.`});
    }
  }

  // 5. Small circle boost recommendation
  if(gap>0){
    const currentSmallBoost=getBoostAt(smallBoostTimeline,0);
    if(currentSmallBoost<2000){
      const tryBoost=Math.min(500,2000-currentSmallBoost);
      const extraPerYear=tryBoost*5*6;
      const extraTotal=extraPerYear*(monthsLeft/12);
      recs.push({type:"action",icon:"🟢",text:`Boosting Small Circle by ج.م ${tryBoost}/mo more adds ~${fmtEGP(extraTotal)} by deadline — ${Math.min(100,Math.round(extraTotal/Math.max(gap,1)*100))}% of gap closed.`});
    }
  }

  // 6. One-time deposit needed
  if(gap>0&&hitIdx<0){
    // How much lump sum needed now to hit goal?
    const mRate=annualReturn/100/12;
    const lumpNeeded=gap/Math.pow(1+mRate,monthsLeft);
    recs.push({type:"action",icon:"💰",text:`A one-time deposit of ${fmtEGP(Math.round(lumpNeeded/1000)*1000)} today would close the gap completely by deadline.`});
  }

  // 7. USD circle impact
  const usdPayoutsBeforeDeadline=rows.slice(0,goal.deadlineAbsIdx+1).filter(r=>r.usdIn>0);
  if(usdPayoutsBeforeDeadline.length>0){
    const totalUsd=usdPayoutsBeforeDeadline.reduce((s,r)=>s+r.usdIn,0);
    recs.push({type:"info",icon:"💵",text:`Your USD circle contributes ${fmtEGP(totalUsd)} (${usdPayoutsBeforeDeadline.length} payout${usdPayoutsBeforeDeadline.length!==1?"s":""}) before your deadline — ${Math.round(totalUsd/Math.max(goal.target,1)*100)}% of goal.`});
  }

  return recs;
}

function annualizeFromTwoPoints(p1,p2){
  // p1, p2: {date, price} with date as ISO string, p1 older
  const d1=new Date(p1.date),d2=new Date(p2.date);
  const days=(d2-d1)/(1000*60*60*24);
  if(days<=0||p1.price<=0)return null;
  const totalReturn=(p2.price-p1.price)/p1.price;
  const dailyRate=Math.pow(1+totalReturn,1/days)-1;
  const annualPct=(Math.pow(1+dailyRate,365)-1)*100;
  return{totalReturn:totalReturn*100,days,annualPct};
}

function BareeqTracker({priceHistory,onUpdateHistory,onApplyRate,currentAnnualReturn}){
  const[fetching,setFetching]=useState(false);
  const[fetchError,setFetchError]=useState("");
  const[lastFetchedToday,setLastFetchedToday]=useState(false);

  const todayISO=new Date().toISOString().slice(0,10);

  const fetchPrice=useCallback(async()=>{
    setFetching(true);setFetchError("");
    try{
      const res=await fetch("/api/bareeq");
      const data=await res.json();
      if(data.error)throw new Error(data.error);

      // Parse English date from AAIM (e.g. "30 Jun, 2026")
      const parseEnglishDate=(str)=>{
        if(!str)return todayISO;
        const months={Jan:"01",Feb:"02",Mar:"03",Apr:"04",May:"05",Jun:"06",Jul:"07",Aug:"08",Sep:"09",Oct:"10",Nov:"11",Dec:"12"};
        const match=str.match(/(\d{1,2})\s+([A-Za-z]{3}),?\s+(\d{4})/);
        if(match){
          const day=match[1].padStart(2,"0");
          const mon=months[match[2]]||"01";
          return`${match[3]}-${mon}-${day}`;
        }
        return todayISO;
      };

      const entryDate=parseEnglishDate(data.lastUpdated);
      const newEntry={date:entryDate,price:data.price,fetchedAt:data.fetchedAt,lastUpdated:data.lastUpdated};

      // Deduplicate by date
      const exists=priceHistory.some(p=>p.date===entryDate);
      if(!exists){
        const updated=[...priceHistory,newEntry].sort((a,b)=>new Date(a.date)-new Date(b.date));
        onUpdateHistory(updated);
      } else {
        const updated=priceHistory.map(p=>p.date===entryDate?newEntry:p).sort((a,b)=>new Date(a.date)-new Date(b.date));
        onUpdateHistory(updated);
      }
      setLastFetchedToday(true);
    }catch(e){
      setFetchError("Could not fetch live price. "+e.message);
    }
    setFetching(false);
  },[priceHistory,onUpdateHistory,todayISO]);

  // Auto-fetch once on mount if we don't have data from today or yesterday
  useEffect(()=>{
    const latestStored=priceHistory.length>0?priceHistory[priceHistory.length-1].date:null;
    const yesterday=new Date();yesterday.setDate(yesterday.getDate()-1);
    const yesterdayISO=yesterday.toISOString().slice(0,10);
    const alreadyCurrent=latestStored===todayISO||latestStored===yesterdayISO;
    if(!alreadyCurrent)fetchPrice();
    else setLastFetchedToday(true);
    // eslint-disable-next-line
  },[]);

  // Combine seed + history for calculation, sorted
  const allPoints=React.useMemo(()=>{
    // Start with seed history points
    const seedPoints=BAREEQ_SEED.history.map(h=>({...h,isSeed:true}));
    // Merge with real fetched history, deduplicating by date (real data takes priority)
    const fetchedDates=new Set(priceHistory.map(p=>p.date));
    const filteredSeeds=seedPoints.filter(p=>!fetchedDates.has(p.date));
    const merged=[...filteredSeeds,...priceHistory];
    return merged.sort((a,b)=>new Date(a.date)-new Date(b.date));
  },[priceHistory]);

  const latest=allPoints[allPoints.length-1];
  const oldest=allPoints[0];
  const calc=allPoints.length>=2?annualizeFromTwoPoints(oldest,latest):null;

  const MIN_DAYS_FOR_REAL_CALC=5;
  const seedAnnualPct=BAREEQ_SEED.seedAnnualPct; // 23.27% from Thndr app
  const seedMonthlyPct=BAREEQ_SEED.seedMonthlyPct; // 1.42% most recent monthly

  const daysTracked=calc?Math.round(calc.days):0;
  const hasEnoughData=calc&&daysTracked>=MIN_DAYS_FOR_REAL_CALC;

  // Annual return: use real only after 5+ days
  const displayAnnualPct=hasEnoughData?calc.annualPct:seedAnnualPct;

  // Monthly return
  const displayMonthlyPct=hasEnoughData
    ?daysTracked>=30
      // 30+ days: use actual price 30 days ago vs latest
      ?(()=>{
        const latestDate=new Date(latest.date);
        const targetDate=new Date(latestDate);targetDate.setDate(targetDate.getDate()-30);
        const point30=allPoints.reduce((prev,curr)=>
          Math.abs(new Date(curr.date)-targetDate)<Math.abs(new Date(prev.date)-targetDate)?curr:prev
        );
        return((latest.price-point30.price)/point30.price)*100;
      })()
      // 5-29 days: derive from annualized
      :(Math.pow(1+calc.annualPct/100,1/12)-1)*100
    // Under 5 days: use seed
    :seedMonthlyPct;

  const monthlySource=!hasEnoughData
    ?`seed (${daysTracked}/${MIN_DAYS_FOR_REAL_CALC} days)`
    :daysTracked>=30?"actual 30-day"
    :`from ${daysTracked}-day data`;

  const dataQuality=!hasEnoughData?"low":daysTracked<30?"medium":"high";
  const qualityColor={low:C.red,medium:C.accent,high:C.green}[dataQuality];
  const annualSource=!hasEnoughData
    ?`seed (need ${MIN_DAYS_FOR_REAL_CALC-daysTracked} more days)`
    :daysTracked<30?`${daysTracked} days tracked`
    :`${daysTracked} days — reliable`;
  const monthlyReturn=displayMonthlyPct;

  const sparkData=allPoints.map(p=>p.price);

  return(<div style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:15,padding:"1.1rem",marginBottom:"0.8rem"}}>
    <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:"0.6rem"}}>
      <div style={{fontSize:"0.65rem",color:C.muted,textTransform:"uppercase",letterSpacing:"0.1em"}}>💎 بريق Fund Tracker</div>
      <button onClick={fetchPrice} disabled={fetching}
        style={{background:`${C.accent}15`,border:`1px solid ${C.accent}35`,borderRadius:6,padding:"0.18rem 0.5rem",cursor:fetching?"default":"pointer",fontSize:"0.65rem",color:C.accent,fontFamily:"inherit"}}>
        {fetching?"⟳ Fetching...":"↻ Refresh Price"}
      </button>
    </div>

    {fetchError&&<div style={{fontSize:"0.65rem",color:C.red,marginBottom:"0.6rem",background:`${C.red}0d`,borderRadius:6,padding:"0.4rem 0.6rem"}}>⚠️ {fetchError}</div>}

    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:"0.5rem",marginBottom:"0.7rem"}}>
      <div>
        <div style={{fontSize:"0.6rem",color:C.muted}}>Current Unit Price</div>
        <div style={{fontSize:"0.9rem",fontWeight:800,color:C.text,fontFamily:"monospace"}}>{latest?.price?.toFixed(4)||"—"} ج.م</div>
        <div style={{fontSize:"0.56rem",color:C.muted}}>{latest?.lastUpdated||latest?.date}</div>
      </div>
      <div>
        <div style={{fontSize:"0.6rem",color:C.muted}}>Monthly Return</div>
        <div style={{fontSize:"0.9rem",fontWeight:800,color:C.green,fontFamily:"monospace"}}>{monthlyReturn.toFixed(2)}%</div>
        <div style={{fontSize:"0.56rem",color:qualityColor}}>{monthlySource}</div>
      </div>
      <div>
        <div style={{fontSize:"0.6rem",color:C.muted}}>Annual Return</div>
        <div style={{fontSize:"0.9rem",fontWeight:800,color:C.green,fontFamily:"monospace"}}>{displayAnnualPct?.toFixed(2)}%</div>
        <div style={{fontSize:"0.56rem",color:qualityColor}}>{annualSource}</div>
      </div>
    </div>

    {sparkData.length>=2&&(<div style={{marginBottom:"0.7rem"}}>
      <Sparkline data={sparkData} color={C.green}/>
    </div>)}

    <button onClick={()=>onApplyRate(Math.round(displayAnnualPct*10)/10)}
      style={{width:"100%",background:Math.abs(currentAnnualReturn-displayAnnualPct)<0.5?C.border:`${C.green}18`,border:`1px solid ${Math.abs(currentAnnualReturn-displayAnnualPct)<0.5?C.border:C.green+"45"}`,borderRadius:8,color:Math.abs(currentAnnualReturn-displayAnnualPct)<0.5?C.muted:C.green,padding:"0.45rem",fontSize:"0.73rem",cursor:"pointer",fontFamily:"inherit",fontWeight:700}}>
      {Math.abs(currentAnnualReturn-displayAnnualPct)<0.5?"✓ Projection already matches":`🔄 Apply ${displayAnnualPct?.toFixed(1)}% to Annual Return`}
    </button>

    <div style={{fontSize:"0.6rem",color:C.muted,marginTop:"0.5rem",lineHeight:1.5}}>
      Seeded with actual monthly returns: 1.71% (Jun 29) → 1.42% (Jun 30). Price auto-checked daily from AAIM's official بريق page — accuracy improves as more days accumulate.
    </div>
  </div>);
}

      {editing?(
        <div style={{display:"flex",gap:"0.2rem",alignItems:"center"}}>
          <input type="number" value={tempVal} onChange={e=>setTempVal(e.target.value)}
            onBlur={commit} onKeyDown={e=>e.key==="Enter"&&commit()} autoFocus
            style={{width:72,background:C.bg,border:`1px solid ${color}`,borderRadius:4,color,padding:"0.15rem 0.3rem",fontSize:"0.63rem",fontFamily:"monospace",outline:"none"}}/>
        </div>
      ):(
        <div style={{cursor:"pointer"}} onClick={()=>{setEditing(true);setTempVal(circle.amount);}}>
          <span style={{fontFamily:"monospace",fontWeight:700,color:justSaved?C.green:color}}>ج.م {circle.amount.toLocaleString()}</span>
          <span style={{color:justSaved?C.green:C.muted,marginLeft:"0.25rem",fontSize:"0.58rem"}}>{justSaved?"✓ applied below":"✎"}</span>
        </div>
      )}
      <div style={{fontSize:"0.55rem",color:C.muted,marginTop:"0.08rem"}}>→ {fmtEGP(circle.payout)}</div>
    </td>
    {months.map(m=>{
      const active=m.absIdx>=circle.start&&m.absIdx<=circle.end;
      const isPay=m.absIdx===circle.payoutAbsIdx;
      if(!active)return <td key={m.absIdx} style={{background:C.bg,borderBottom:`1px solid ${C.border}`,borderRight:`1px solid ${C.border}15`,minWidth:52}}/>;
      return(<td key={m.absIdx} style={{background:isPay?color:`${color}18`,borderBottom:`1px solid ${C.border}`,borderRight:`1px solid ${C.border}25`,padding:"0.25rem 0.15rem",textAlign:"center",minWidth:52}}>
        <div style={{fontSize:"0.63rem",fontFamily:"monospace",fontWeight:isPay?900:500,color:isPay?"#fff":color}}>
          {isPay?"★":circle.amount.toLocaleString()}
        </div>
        {isPay&&<div style={{fontSize:"0.52rem",color:"rgba(255,255,255,0.85)",marginTop:"0.08rem"}}>{circle.payout.toLocaleString()}</div>}
      </td>);
    })}
  </tr>);
}

function App(){
  const local=loadLocalState()||{};
  const[annualReturn,setAnnualReturn]=useState(local.annualReturn||21);
  const[inflation,setInflation]=useState(local.inflation||25);
  const[usdRate,setUsdRate]=useState(local.usdRate||49);
  const[usdLoading,setUsdLoading]=useState(false);
  const[usdSource,setUsdSource]=useState("manual");
  const[horizon,setHorizon]=useState(local.horizon||36);
  const[activeTab,setActiveTab]=useState("calendar");
  const[bigBoostTimeline,setBigBoostTimeline]=useState(local.bigBoostTimeline||[]);
  const[smallBoostTimeline,setSmallBoostTimeline]=useState(local.smallBoostTimeline||[]);
  const[withdrawalTimeline,setWithdrawalTimeline]=useState(local.withdrawalTimeline||[]);
  const[bareeqPriceHistory,setBareeqPriceHistory]=useState(local.bareeqPriceHistory||[]);
  const[manualDeposits,setManualDeposits]=useState(local.manualDeposits||[]);
  const[bigCircleAmounts,setBigCircleAmounts]=useState(local.bigCircleAmounts||[...DEFAULT_BIG_AMOUNTS]);
  const[smallCircleAmounts,setSmallCircleAmounts]=useState(local.smallCircleAmounts||[...DEFAULT_SMALL_AMOUNTS]);
  const[initialFund,setInitialFund]=useState(local.initialFund||40000);
  const[fundInput,setFundInput]=useState(String(local.initialFund||40000));
  const[goals,setGoals]=useState(local.goals||[]);
  const[savedMsg,setSavedMsg]=useState("⟳ Loading...");
  const[syncStatus,setSyncStatus]=useState("loading"); // loading|synced|local|error
  const saveTimer=React.useRef(null);

  // On mount: load from cloud first, override local state
  useEffect(()=>{
    cloudLoad().then(data=>{
      if(data){
        if(data.annualReturn)setAnnualReturn(data.annualReturn);
        if(data.inflation)setInflation(data.inflation);
        if(data.usdRate)setUsdRate(data.usdRate);
        if(data.horizon)setHorizon(data.horizon);
        if(data.bigBoostTimeline)setBigBoostTimeline(data.bigBoostTimeline);
        if(data.smallBoostTimeline)setSmallBoostTimeline(data.smallBoostTimeline);
        if(data.withdrawalTimeline)setWithdrawalTimeline(data.withdrawalTimeline);
        if(data.bareeqPriceHistory)setBareeqPriceHistory(data.bareeqPriceHistory);
        if(data.manualDeposits)setManualDeposits(data.manualDeposits);
        if(data.bigCircleAmounts)setBigCircleAmounts(data.bigCircleAmounts);
        if(data.smallCircleAmounts)setSmallCircleAmounts(data.smallCircleAmounts);
        if(data.initialFund){setInitialFund(data.initialFund);setFundInput(String(data.initialFund));}
        if(data.goals)setGoals(data.goals);
        if(data.joined)localStorage.setItem("inv_joined",JSON.stringify(data.joined));
        setSyncStatus("synced");
        setSavedMsg("☁️ Loaded from cloud");
        setTimeout(()=>setSavedMsg(""),3000);
      } else {
        setSyncStatus("local");
        setSavedMsg("");
      }
    }).catch(()=>{setSyncStatus("error");setSavedMsg("");});
  },[]);

  // Debounced auto-save to cloud on any change
  useEffect(()=>{
    if(syncStatus==="loading")return;
    if(saveTimer.current)clearTimeout(saveTimer.current);
    saveTimer.current=setTimeout(async()=>{
      const state={annualReturn,inflation,usdRate,horizon,bigBoostTimeline,smallBoostTimeline,withdrawalTimeline,bareeqPriceHistory,manualDeposits,bigCircleAmounts,smallCircleAmounts,initialFund,goals,joined:JSON.parse(localStorage.getItem("inv_joined")||"[]")};
      setSavedMsg("⟳ Saving...");
      await cloudSave(state);
      setSyncStatus("synced");
      setSavedMsg("☁️ Synced");
      setTimeout(()=>setSavedMsg(""),2500);
    },1200);
    return()=>{if(saveTimer.current)clearTimeout(saveTimer.current);};
  },[annualReturn,inflation,usdRate,horizon,bigBoostTimeline,smallBoostTimeline,withdrawalTimeline,bareeqPriceHistory,manualDeposits,bigCircleAmounts,smallCircleAmounts,initialFund,goals]);

  // Fetch live USD/EGP from free public API
  const fetchRate=useCallback(async()=>{
    setUsdLoading(true);
    try{
      // Try exchangerate-api (free, no key needed for this endpoint)
      const res=await fetch("https://api.exchangerate-api.com/v4/latest/USD");
      const data=await res.json();
      if(data.rates&&data.rates.EGP){
        setUsdRate(parseFloat(data.rates.EGP.toFixed(2)));
        setUsdSource("live");
      }
    }catch{
      // Fallback: try another free API
      try{
        const res2=await fetch("https://open.er-api.com/v6/latest/USD");
        const data2=await res2.json();
        if(data2.rates&&data2.rates.EGP){
          setUsdRate(parseFloat(data2.rates.EGP.toFixed(2)));
          setUsdSource("live");
        }
      }catch(e){console.error("Rate fetch failed",e);}
    }
    setUsdLoading(false);
  },[]);

  useEffect(()=>{fetchRate();},[]);

  const rows=useMemo(()=>simulate({initialFund,annualReturn,inflation,usdRate,bigBoostTimeline,smallBoostTimeline,withdrawalTimeline,manualDeposits,bigCircleAmounts,smallCircleAmounts,horizonMonths:horizon}),[initialFund,annualReturn,inflation,usdRate,bigBoostTimeline,smallBoostTimeline,withdrawalTimeline,manualDeposits,bigCircleAmounts,smallCircleAmounts,horizon]);
  const last=rows[rows.length-1]||{};
  const uniqueYears=[...new Set(rows.map(r=>r.year))];

  // ── Export settings as JSON file ──
  const exportSettings=()=>{
    const data={
      version:1,
      exportedAt:new Date().toISOString(),
      annualReturn,inflation,usdRate,horizon,
      bigBoostTimeline,smallBoostTimeline,
      manualDeposits,initialFund,goals,
      joined:JSON.parse(localStorage.getItem("inv_joined")||"[]"),
    };
    const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");
    a.href=url;
    a.download=`investment-settings-${new Date().toISOString().slice(0,10)}.json`;
    a.click();
    URL.revokeObjectURL(url);
  };

  // ── Import settings from JSON file ──
  const importSettings=()=>{
    const input=document.createElement("input");
    input.type="file";
    input.accept=".json";
    input.onchange=(e)=>{
      const file=e.target.files[0];
      if(!file)return;
      const reader=new FileReader();
      reader.onload=(ev)=>{
        try{
          const data=JSON.parse(ev.target.result);
          if(data.annualReturn)setAnnualReturn(data.annualReturn);
          if(data.inflation)setInflation(data.inflation);
          if(data.usdRate)setUsdRate(data.usdRate);
          if(data.horizon)setHorizon(data.horizon);
          if(data.bigBoostTimeline)setBigBoostTimeline(data.bigBoostTimeline);
          if(data.smallBoostTimeline)setSmallBoostTimeline(data.smallBoostTimeline);
          if(data.manualDeposits)setManualDeposits(data.manualDeposits);
          if(data.initialFund){setInitialFund(data.initialFund);setFundInput(String(data.initialFund));}
          if(data.goals)setGoals(data.goals);
          if(data.joined)localStorage.setItem("inv_joined",JSON.stringify(data.joined));
          setSavedMsg("✓ Imported!");
        }catch{alert("Invalid file — please use a previously exported settings file.");}
      };
      reader.readAsText(file);
    };
    input.click();
  };

  const tabStyle=(t)=>({padding:"0.5rem 0.8rem",fontSize:"0.73rem",cursor:"pointer",border:"none",background:"transparent",fontFamily:"inherit",color:activeTab===t?C.accent:C.muted,borderBottom:activeTab===t?`2px solid ${C.accent}`:"2px solid transparent",fontWeight:activeTab===t?700:400,marginBottom:-1,transition:"all 0.2s",whiteSpace:"nowrap"});

  return(<>
    <div style={{minHeight:"100vh",background:C.bg,fontFamily:"'Tajawal',sans-serif",color:C.text,padding:"1rem 0.7rem"}}>
      <div style={{maxWidth:1040,margin:"0 auto"}}>

        {/* Header */}
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:"1.1rem",flexWrap:"wrap",gap:"0.7rem"}}>
          <div style={{display:"flex",alignItems:"center",gap:"0.75rem"}}>
            <div style={{width:40,height:40,borderRadius:10,background:`linear-gradient(135deg,${C.accent},#e67e22)`,display:"grid",placeItems:"center",fontSize:"1.25rem",flexShrink:0}}>📊</div>
            <div>
              <h1 style={{fontSize:"1.15rem",fontWeight:900,letterSpacing:"-0.02em"}}>حاسبة الاستثمار</h1>
              <p style={{fontSize:"0.65rem",color:C.sub}}>Fixed Income · EGP & USD Circles</p>
            </div>
          </div>
          <div style={{textAlign:"right"}}>
            <div style={{display:"flex",alignItems:"center",gap:"0.5rem",justifyContent:"flex-end",marginBottom:"0.2rem"}}>
              {savedMsg&&<span style={{fontSize:"0.62rem",color:syncStatus==="synced"?C.green:syncStatus==="error"?C.red:C.accent,fontWeight:700}}>{savedMsg}</span>}
              {!savedMsg&&syncStatus==="synced"&&<span style={{fontSize:"0.62rem",color:C.green}}>☁️ Synced</span>}
              {!savedMsg&&syncStatus==="error"&&<span style={{fontSize:"0.62rem",color:C.red}}>⚠️ Offline</span>}
              <button onClick={exportSettings}
                style={{fontSize:"0.6rem",color:C.blue,background:`${C.blue}12`,border:`1px solid ${C.blue}35`,borderRadius:5,padding:"0.15rem 0.5rem",cursor:"pointer",fontFamily:"inherit",fontWeight:700}}>
                ⬇ Export
              </button>
              <button onClick={importSettings}
                style={{fontSize:"0.6rem",color:C.accent,background:`${C.accent}12`,border:`1px solid ${C.accent}35`,borderRadius:5,padding:"0.15rem 0.5rem",cursor:"pointer",fontFamily:"inherit",fontWeight:700}}>
                ⬆ Import
              </button>
              <button onClick={()=>{if(window.confirm("Reset all settings to defaults?")){localStorage.removeItem(STORAGE_KEY);window.location.reload();}}}
                style={{fontSize:"0.6rem",color:C.muted,background:"none",border:`1px solid ${C.border}`,borderRadius:5,padding:"0.15rem 0.4rem",cursor:"pointer",fontFamily:"inherit"}}>
                🗑 Reset
              </button>
            </div>
            <div style={{fontSize:"0.6rem",color:C.muted,marginBottom:"0.1rem"}}>{usdSource==="live"?"🟢 Live":"🔵 Manual"}</div>
            <div style={{display:"flex",alignItems:"center",gap:"0.4rem"}}>
              <span style={{fontFamily:"monospace",fontSize:"0.9rem",fontWeight:700,color:C.accent}}>{usdLoading?"fetching…":`$1 = ج.م ${usdRate}`}</span>
              <button onClick={fetchRate} style={{background:`${C.accent}15`,border:`1px solid ${C.accent}35`,borderRadius:6,padding:"0.18rem 0.4rem",cursor:"pointer",fontSize:"0.68rem",color:C.accent,fontFamily:"inherit"}}>{usdLoading?"⟳":"↻"}</button>
            </div>
          </div>
        </div>

        {/* Stat cards */}
        <div className="stat-grid" style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:"0.6rem",marginBottom:"0.9rem"}}>
          <StatCard label="Final Value" value={fmtEGP(last.balance||initialFund)} sub={`${horizon} months`} color={C.accent} icon="💰"/>
          <StatCard label="Real Value" value={fmtEGP(last.realValue||initialFund)} sub="Inflation-adj." color={C.purple} icon="📉"/>
          <StatCard label="Deposited" value={fmtEGP(last.totalDeposited||initialFund)} sub="All + initial" color={C.blue} icon="📥"/>
          <StatCard label="Fund Gain" value={fmtEGP(last.gain||0)} sub={`At ${annualReturn}%`} color={C.green} icon="📈"/>
        </div>

        {/* Sparklines */}
        <div className="spark-grid" style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"0.6rem",marginBottom:"0.9rem"}}>
          {[{label:"Nominal Growth",data:rows.map(r=>r.balance),color:C.accent},{label:"Real Value",data:rows.map(r=>r.realValue),color:C.purple}].map(s=>(
            <div key={s.label} style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:11,padding:"0.7rem 0.9rem"}}>
              <div style={{fontSize:"0.65rem",color:C.muted,marginBottom:"0.25rem"}}>{s.label}</div>
              <Sparkline data={s.data} color={s.color}/>
            </div>
          ))}
        </div>

        {/* Main layout */}
        <div className="main-grid" style={{display:"grid",gridTemplateColumns:"270px 1fr",gap:"0.9rem",alignItems:"start"}}>

          {/* LEFT */}
          <div style={{display:"flex",flexDirection:"column",gap:"0.8rem"}}>
            <AlertPanel horizonMonths={horizon} bigBoostTimeline={bigBoostTimeline} smallBoostTimeline={smallBoostTimeline} bigCircleAmounts={bigCircleAmounts} smallCircleAmounts={smallCircleAmounts}/>

            <BareeqTracker
              priceHistory={bareeqPriceHistory}
              onUpdateHistory={setBareeqPriceHistory}
              onApplyRate={setAnnualReturn}
              currentAnnualReturn={annualReturn}
            />

            <div style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:15,padding:"1.1rem"}}>
              <div style={{fontSize:"0.65rem",color:C.muted,textTransform:"uppercase",letterSpacing:"0.1em",marginBottom:"0.9rem"}}>⚙️ Fund Settings</div>
              {/* Editable balance */}
              <div style={{marginBottom:"1.1rem"}}>
                <div style={{display:"flex",justifyContent:"space-between",marginBottom:"0.3rem"}}>
                  <span style={{fontSize:"0.73rem",color:C.sub}}>Current Fund Balance</span>
                  <span style={{fontSize:"0.62rem",color:C.muted}}>ج.م</span>
                </div>
                <div style={{position:"relative"}}>
                  <input type="number" value={fundInput}
                    onChange={e=>{setFundInput(e.target.value);const v=parseFloat(e.target.value);if(!isNaN(v)&&v>=0)setInitialFund(v);}}
                    onBlur={()=>setFundInput(initialFund.toString())}
                    style={{width:"100%",background:"#070b12",border:`1px solid ${C.accent}50`,borderRadius:8,color:C.accent,padding:"0.45rem 2.5rem 0.45rem 0.6rem",fontSize:"1rem",fontFamily:"monospace",fontWeight:700,outline:"none"}}/>
                  <span style={{position:"absolute",right:"0.6rem",top:"50%",transform:"translateY(-50%)",fontSize:"0.68rem",color:C.muted,pointerEvents:"none"}}>ج.م</span>
                </div>
                <div style={{fontSize:"0.62rem",color:C.muted,marginTop:"0.3rem"}}>Edit to match your actual fund balance</div>
              </div>
              <Slider label="Annual Return" value={annualReturn} min={18} max={28} step={0.5} onChange={setAnnualReturn} fmt={v=>`${v}%`} color={C.green}/>
              <Slider label="Egyptian Inflation" value={inflation} min={10} max={40} step={0.5} onChange={setInflation} fmt={v=>`${v}%`} color={C.red}/>
              <Slider label="USD/EGP Rate" value={usdRate} min={40} max={80} step={0.25} onChange={v=>{setUsdRate(v);setUsdSource("manual");}} fmt={v=>`${v} ج.م`} color={C.accent}/>
              <Slider label="Horizon" value={horizon} min={6} max={60} step={1} onChange={setHorizon} fmt={v=>`${v} months`} color={C.blue}/>
            </div>

            {/* Return Withdrawal Panel */}
            <div style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:15,padding:"1.1rem"}}>
              <div style={{fontSize:"0.65rem",color:C.muted,textTransform:"uppercase",letterSpacing:"0.1em",marginBottom:"0.5rem"}}>💸 Fund Return Withdrawal</div>
              <div style={{fontSize:"0.68rem",color:C.sub,marginBottom:"0.9rem",lineHeight:1.6}}>
                Set how much to withdraw from your monthly fund return. Choose a fixed ج.م amount or a % of return.
              </div>

              {withdrawalTimeline.length===0&&<div style={{fontSize:"0.68rem",color:C.muted,fontStyle:"italic",marginBottom:"0.6rem"}}>No withdrawal — 100% compounding</div>}
              {withdrawalTimeline.map(p=>{
                const{year,month}=absToDate(p.absIdx);
                const ni=withdrawalTimeline.findIndex(x=>x.absIdx>p.absIdx);
                const np=ni>=0?withdrawalTimeline[ni]:null;
                const until=np?(()=>{const d=absToDate(np.absIdx-1);return`${MONTHS_EN[d.month]} ${d.year}`;})():"onwards";
                const sampleRow=rows.find(r=>r.absIdx===p.absIdx);
                const estWithdrawal=sampleRow
                  ? p.mode==="pct"
                    ? Math.round(sampleRow.returnAmt*(p.amount/100))
                    : p.amount
                  : 0;
                return(<div key={p.absIdx} style={{display:"flex",alignItems:"center",gap:"0.4rem",marginBottom:"0.35rem",background:`${C.accent}0e`,borderRadius:7,padding:"0.38rem 0.65rem"}}>
                  <div style={{flex:1}}>
                    <span style={{fontSize:"0.7rem",color:C.sub}}>From </span>
                    <span style={{fontSize:"0.72rem",color:C.text,fontWeight:700}}>{MONTHS_EN[month]} {year}</span>
                    <span style={{fontSize:"0.68rem",color:C.muted}}> → {until}</span>
                    {estWithdrawal>0&&<div style={{fontSize:"0.65rem",color:C.accent}}>≈ {fmtEGP(estWithdrawal)}/mo</div>}
                  </div>
                  <span style={{fontSize:"0.75rem",color:C.accent,fontFamily:"monospace",fontWeight:700}}>
                    {p.mode==="pct"?`${p.amount}%`:fmtEGP(p.amount)}
                  </span>
                  <span style={{fontSize:"0.6rem",color:C.muted,background:C.border,borderRadius:4,padding:"0.1rem 0.3rem"}}>{p.mode==="pct"?"%":"ج.م"}</span>
                  <button onClick={()=>setWithdrawalTimeline(withdrawalTimeline.filter(x=>x.absIdx!==p.absIdx))}
                    style={{background:"none",border:"none",color:C.red,cursor:"pointer",fontSize:"0.78rem"}}>✕</button>
                </div>);
              })}

              {/* Add new withdrawal point */}
              {(()=>{
                const[selMonth,setSelMonth]=useState(0);
                const[selAmount,setSelAmount]=useState(0);
                const[selMode,setSelMode]=useState("pct"); // "pct" or "egp"
                const[wError,setWError]=useState("");
                const monthOptions=Array.from({length:horizon},(_,i)=>{const{year,month}=absToDate(i);return{absIdx:i,label:`${MONTHS_EN[month]} ${year}`};});

                // Preview: estimate withdrawal based on mode
                const sampleRow=rows.find(r=>r.absIdx===selMonth);
                const estPreview=sampleRow&&selAmount>0
                  ? selMode==="pct"
                    ? Math.round(sampleRow.returnAmt*(selAmount/100))
                    : selAmount
                  : 0;

                const addW=()=>{
                  if(selAmount<=0){setWError("Enter an amount greater than 0.");return;}
                  if(selMode==="pct"&&selAmount>100){setWError("Percentage must be 0–100%");return;}
                  setWError("");
                  const updated=[...withdrawalTimeline.filter(p=>p.absIdx!==selMonth),{absIdx:selMonth,amount:selAmount,mode:selMode}].sort((a,b)=>a.absIdx-b.absIdx);
                  setWithdrawalTimeline(updated);
                  setSelAmount(0);
                };

                // Get current active setting for selected month
                const activePoint=withdrawalTimeline.slice().reverse().find(p=>p.absIdx<=selMonth)||null;
                const activeLabel=activePoint
                  ? activePoint.mode==="pct"?`${activePoint.amount}% of return`:fmtEGP(activePoint.amount)+" fixed"
                  : "No withdrawal";

                return(<>
                  {/* Mode toggle */}
                  <div style={{display:"flex",gap:"0.4rem",marginBottom:"0.6rem",marginTop:"0.5rem"}}>
                    {[["pct","% of Return"],["egp","Fixed ج.م"]].map(([m,l])=>(
                      <button key={m} onClick={()=>{setSelMode(m);setSelAmount(0);setWError("");}}
                        style={{flex:1,padding:"0.35rem",borderRadius:8,border:`1px solid ${selMode===m?C.accent:C.border}`,background:selMode===m?`${C.accent}18`:"transparent",color:selMode===m?C.accent:C.muted,fontSize:"0.72rem",cursor:"pointer",fontFamily:"inherit",fontWeight:selMode===m?700:400}}>
                        {l}
                      </button>
                    ))}
                  </div>

                  <div style={{display:"flex",gap:"0.4rem",flexWrap:"wrap"}}>
                    <select value={selMonth} onChange={e=>{setSelMonth(Number(e.target.value));setWError("");}}
                      style={{background:C.bg,border:`1px solid ${C.border}`,borderRadius:7,color:C.text,padding:"0.35rem",fontSize:"0.72rem",fontFamily:"inherit",flex:"1 1 90px",minWidth:0}}>
                      {monthOptions.map(o=><option key={o.absIdx} value={o.absIdx}>{o.label}</option>)}
                    </select>
                    <div style={{display:"flex",alignItems:"center",gap:"0.3rem",flex:"1 1 80px"}}>
                      <input type="number" value={selAmount||""} min={0} max={selMode==="pct"?100:99999} step={selMode==="pct"?5:100}
                        onChange={e=>{setSelAmount(Number(e.target.value));setWError("");}}
                        placeholder={selMode==="pct"?"e.g. 30":"e.g. 2000"}
                        style={{width:"100%",background:C.bg,border:`1px solid ${wError?C.red:C.border}`,borderRadius:7,color:C.accent,padding:"0.35rem",fontSize:"0.78rem",fontFamily:"monospace",outline:"none"}}/>
                      <span style={{color:C.muted,fontSize:"0.78rem",flexShrink:0}}>{selMode==="pct"?"%":"ج.م"}</span>
                    </div>
                    <button onClick={addW}
                      style={{background:`${C.accent}18`,border:`1px solid ${C.accent}40`,borderRadius:7,color:C.accent,padding:"0.3rem 0.7rem",fontSize:"0.72rem",cursor:"pointer",fontFamily:"inherit",fontWeight:700}}>
                      + Set
                    </button>
                  </div>

                  {/* Live preview */}
                  {estPreview>0&&<div style={{fontSize:"0.68rem",color:C.accent,marginTop:"0.35rem"}}>
                    ≈ {fmtEGP(estPreview)}/mo withdrawn at {MONTHS_EN[absToDate(selMonth).month]} {absToDate(selMonth).year}
                    {selMode==="pct"&&sampleRow&&<span style={{color:C.muted}}> ({selAmount}% of ≈{fmtEGP(Math.round(sampleRow.returnAmt))} return)</span>}
                  </div>}

                  {wError&&<div style={{fontSize:"0.65rem",color:C.red,marginTop:"0.3rem"}}>⚠️ {wError}</div>}
                  <div style={{fontSize:"0.62rem",color:C.muted,marginTop:"0.3rem"}}>
                    Active for selected month: <span style={{color:C.accent,fontWeight:700}}>{activeLabel}</span>
                  </div>
                  {withdrawalTimeline.length>0&&<div style={{fontSize:"0.68rem",color:C.sub,marginTop:"0.7rem",lineHeight:1.5,background:`${C.blue}08`,borderRadius:8,padding:"0.5rem 0.7rem"}}>
                    💡 To route withdrawn cash to circles, set boost amounts in the panel above.
                  </div>}
                </>);
              })()}
            </div>

            <ManualDepositsPanel deposits={manualDeposits} onChange={setManualDeposits} horizonMonths={horizon}/>
          </div>

          {/* RIGHT */}
          <div style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:15,overflow:"hidden"}}>
            <div style={{display:"flex",borderBottom:`1px solid ${C.border}`,padding:"0 0.6rem",overflowX:"auto"}}>
              {[["calendar","📅 Monthly"],["schedule","📊 Schedule"],["income","💼 Income"],["yearly","📆 Yearly"],["circles","⭕ Circles"],["goals","🎯 Goals"],["insights","🤖 AI Insights"]].map(([t,l])=>(
                <button key={t} style={tabStyle(t)} onClick={()=>setActiveTab(t)}>{l}</button>
              ))}
            </div>

            {/* Monthly Calendar */}
            {activeTab==="calendar"&&(<div style={{maxHeight:560,overflowY:"auto"}}>
              <div style={{display:"grid",gridTemplateColumns:"80px 1fr 115px",gap:"0.3rem",padding:"0.45rem 0.9rem",fontSize:"0.6rem",color:C.muted,textTransform:"uppercase",letterSpacing:"0.07em",borderBottom:`1px solid ${C.border}`,position:"sticky",top:0,background:C.card,zIndex:1}}>
                <span>Month</span><span>Payouts → Fund</span><span style={{textAlign:"right"}}>Balance</span>
              </div>
              {rows.map((r,i)=>{
                const has=r.bigPayout>0||r.smallPayout>0||r.usdIn>0||r.manualIn>0;
                return(<div key={i} className="cal-row" style={{display:"grid",gridTemplateColumns:"80px 1fr 115px",gap:"0.3rem",padding:"0.45rem 0.9rem",borderBottom:`1px solid ${C.border}15`,alignItems:"center",background:has?"rgba(255,255,255,0.012)":"transparent",transition:"background 0.15s"}}>
                  <div>
                    <div style={{fontSize:"0.78rem",fontWeight:has?700:400,color:has?C.text:C.muted}}>{MONTHS_EN[r.month]}</div>
                    <div style={{fontSize:"0.6rem",color:C.muted}}>{r.year}</div>
                  </div>
                  <div style={{display:"flex",flexWrap:"wrap",gap:"0.25rem"}}>
                    {r.bigPayout>0&&<span style={{fontSize:"0.65rem",background:`${C.blue}12`,border:`1px solid ${C.blue}28`,borderRadius:5,padding:"0.12rem 0.4rem",color:C.blue}}>🔵 {fmtEGP(r.bigPayout)}</span>}
                    {r.smallPayout>0&&<span style={{fontSize:"0.65rem",background:`${C.green}12`,border:`1px solid ${C.green}28`,borderRadius:5,padding:"0.12rem 0.4rem",color:C.green}}>🟢 {fmtEGP(r.smallPayout)}</span>}
                    {r.usdIn>0&&<span style={{fontSize:"0.65rem",background:`${C.accent}12`,border:`1px solid ${C.accent}28`,borderRadius:5,padding:"0.12rem 0.4rem",color:C.accent}}>💵 {fmtEGP(r.usdIn)}</span>}
                    {r.manualIn>0&&<span style={{fontSize:"0.65rem",background:`${C.teal}12`,border:`1px solid ${C.teal}28`,borderRadius:5,padding:"0.12rem 0.4rem",color:C.teal}}>➕ {fmtEGP(r.manualIn)}</span>}
                    {r.returnWithdrawn>0&&<span style={{fontSize:"0.65rem",background:`${C.accent}12`,border:`1px solid ${C.accent}28`,borderRadius:5,padding:"0.12rem 0.4rem",color:C.accent}}>💸 {fmtEGP(r.returnWithdrawn)} ({r.withdrawalDisplay})</span>}
                    {!has&&!r.returnWithdrawn&&<span style={{fontSize:"0.65rem",color:C.muted}}>—</span>}
                  </div>
                  <div style={{textAlign:"right"}}>
                    <div style={{fontSize:"0.78rem",fontFamily:"monospace",fontWeight:700,color:C.accent}}>{fmtEGP(r.balance)}</div>
                    <div style={{fontSize:"0.58rem",color:C.muted}}>+{fmtEGP(r.returnAmt)}</div>
                  </div>
                </div>);
              })}
            </div>)}

            {/* Cash Flow */}
            {/* Schedule Table */}
            {activeTab==="schedule"&&(()=>{
              // Build circle data for the table
              const tableMonths=Array.from({length:horizon+2},(_,i)=>({
                absIdx:i-2,
                label:`${MONTHS_EN[((3+i-2)%12+12)%12]} ${2026+Math.floor((3+i-2)/12)}`,
                month:((3+i-2)%12+12)%12,
              }));
              const bigCircles=[];let bi=0;
              for(let start=-2;start<horizon;start+=2){
                bigCircles.push({idx:bi,start,end:start+5,amount:bigCircleAmounts[bi]||2000,payoutAbsIdx:start+3,payout:(bigCircleAmounts[bi]||2000)*5});
                bi++;
              }
              const smallCircles=[];let si=0;
              for(let start=1;start<horizon;start+=2){
                smallCircles.push({idx:si,start,end:start+5,amount:smallCircleAmounts[si]||1000,payoutAbsIdx:start+3,payout:(smallCircleAmounts[si]||1000)*5});
                si++;
              }
              // Monthly summary from rows
              const stickyTd=(label,color)=>(
                <td style={{background:C.card,padding:"0.28rem 0.5rem",fontSize:"0.6rem",color,position:"sticky",left:0,zIndex:2,borderBottom:`1px solid ${C.border}`,minWidth:105,whiteSpace:"nowrap",fontWeight:700}}>{label}</td>
              );
              return(<div style={{maxHeight:520,overflowY:"auto",overflowX:"auto",position:"relative"}}>
                <div>
                  <table style={{borderCollapse:"collapse",width:"100%"}}>
                    <thead>
                      <tr>
                        <th style={{background:C.card,padding:"0.4rem 0.5rem",fontSize:"0.6rem",color:C.muted,textAlign:"left",position:"sticky",left:0,top:0,zIndex:5,borderBottom:`2px solid ${C.border}`,minWidth:105}}>Circle / Month</th>
                        {tableMonths.map(m=>(
                          <th key={m.absIdx} style={{background:C.card,padding:"0.3rem 0.1rem",fontSize:"0.56rem",color:C.sub,textAlign:"center",borderBottom:`2px solid ${C.border}`,borderRight:`1px solid ${C.border}15`,minWidth:52,whiteSpace:"nowrap",position:"sticky",top:0,zIndex:3}}>
                            {MONTHS_EN[m.month]}<br/><span style={{color:C.muted,fontSize:"0.48rem"}}>{2026+Math.floor((3+m.absIdx)/12)}</span>
                          </th>
                        ))}
                      </tr>
                    </thead>
                    <tbody>
                      <tr><td colSpan={tableMonths.length+1} style={{background:`${C.blue}15`,padding:"0.28rem 0.5rem",fontSize:"0.63rem",fontWeight:700,color:C.blue,borderBottom:`1px solid ${C.blue}30`,position:"sticky",left:0}}>🔵 Big EGP Circles — click amount to edit</td></tr>
                      {bigCircles.map(c=><CircleTableRow key={c.idx} circle={c} months={tableMonths} onAmountChange={(idx,val)=>{setBigCircleAmounts(prev=>{const n=[...prev];for(let x=idx;x<n.length;x++)n[x]=val;return n;});}} color={C.blue}/>)}
                      <tr><td colSpan={tableMonths.length+1} style={{background:`${C.green}15`,padding:"0.28rem 0.5rem",fontSize:"0.63rem",fontWeight:700,color:C.green,borderBottom:`1px solid ${C.green}30`,position:"sticky",left:0}}>🟢 Small EGP Circles — click amount to edit</td></tr>
                      {smallCircles.map(c=><CircleTableRow key={c.idx} circle={c} months={tableMonths} onAmountChange={(idx,val)=>{setSmallCircleAmounts(prev=>{const n=[...prev];for(let x=idx;x<n.length;x++)n[x]=val;return n;});}} color={C.green}/>)}
                      <tr><td colSpan={tableMonths.length+1} style={{background:`${C.accent}10`,padding:"0.28rem 0.5rem",fontSize:"0.63rem",fontWeight:700,color:C.accent,borderTop:`2px solid ${C.border}`,borderBottom:`1px solid ${C.accent}25`,position:"sticky",left:0}}>📊 Monthly Summary</td></tr>
                      <tr>
                        {stickyTd("💼 Total Wages Out",C.red)}
                        {tableMonths.map(m=>{const r=rows.find(x=>x.absIdx===m.absIdx);const v=r?r.bigWage+r.smallWage:0;return(<td key={m.absIdx} style={{background:v>0?`${C.red}10`:C.bg,padding:"0.25rem 0.1rem",textAlign:"center",fontSize:"0.63rem",fontFamily:"monospace",color:v>0?C.red:C.muted,borderBottom:`1px solid ${C.border}`,borderRight:`1px solid ${C.border}15`,fontWeight:v>0?700:400}}>{v>0?v.toLocaleString():"—"}</td>);})}
                      </tr>
                      <tr>
                        {stickyTd("💰 Payouts → Fund",C.green)}
                        {tableMonths.map(m=>{const r=rows.find(x=>x.absIdx===m.absIdx);const v=r?r.bigPayout+r.smallPayout+r.usdIn+r.manualIn:0;return(<td key={m.absIdx} style={{background:v>0?`${C.green}10`:C.bg,padding:"0.25rem 0.1rem",textAlign:"center",fontSize:"0.63rem",fontFamily:"monospace",color:v>0?C.green:C.muted,borderBottom:`1px solid ${C.border}`,borderRight:`1px solid ${C.border}15`,fontWeight:v>0?700:400}}>{v>0?v.toLocaleString():"—"}</td>);})}
                      </tr>
                      <tr>
                        {stickyTd("⚡ Net Cash Flow",C.accent)}
                        {tableMonths.map(m=>{const r=rows.find(x=>x.absIdx===m.absIdx);const tin=r?r.bigPayout+r.smallPayout+r.usdIn+r.manualIn:0;const out=r?r.bigWage+r.smallWage:0;const net=tin-out-(r?r.returnWithdrawn:0);return(<td key={m.absIdx} style={{background:net>0?`${C.green}18`:net<0?`${C.red}12`:C.bg,padding:"0.25rem 0.1rem",textAlign:"center",fontSize:"0.65rem",fontFamily:"monospace",color:net>0?C.green:net<0?C.red:C.muted,borderRight:`1px solid ${C.border}15`,fontWeight:800}}>{net===0?"—":`${net>0?"+":""}${Math.round(Math.abs(net)).toLocaleString()}`}</td>);})}
                      </tr>
                    </tbody>
                  </table>
                </div>
                <div style={{padding:"0.5rem 0.9rem",borderTop:`1px solid ${C.border}`,display:"flex",gap:"1rem",fontSize:"0.63rem",flexWrap:"wrap"}}>
                  <span style={{color:C.blue}}>Filled = paying · ★ = payout month</span>
                  <span style={{color:C.sub}}>✎ Click left label to change circle amount</span>
                  <span style={{color:C.green}}>Green net = positive · </span><span style={{color:C.red}}>Red = more going out</span>
                </div>
              </div>);
            })()}

            {/* Income Source */}
            {activeTab==="income"&&(<div style={{maxHeight:560,overflowY:"auto"}}>
              <div style={{display:"flex",gap:"1rem",padding:"0.55rem 0.9rem",borderBottom:`1px solid ${C.border}`,flexWrap:"wrap"}}>
                <span style={{fontSize:"0.67rem",color:C.blue}}>💼 From wages</span>
                <span style={{fontSize:"0.67rem",color:C.green}}>📈 From fund (boost)</span>
              </div>
              <div style={{display:"grid",gridTemplateColumns:"80px repeat(4,1fr)",gap:"0.2rem",padding:"0.4rem 0.9rem",fontSize:"0.58rem",color:C.muted,textTransform:"uppercase",letterSpacing:"0.06em",borderBottom:`1px solid ${C.border}`,position:"sticky",top:0,background:C.card,zIndex:1}}>
                <span>Month</span><span style={{textAlign:"right"}}>💼 Big</span><span style={{textAlign:"right"}}>📈 Big</span><span style={{textAlign:"right"}}>💼 Small</span><span style={{textAlign:"right"}}>📈 Small</span>
              </div>
              {rows.map((r,i)=>(
                <div key={i} className="cal-row" style={{display:"grid",gridTemplateColumns:"80px repeat(4,1fr)",gap:"0.2rem",padding:"0.38rem 0.9rem",borderBottom:`1px solid ${C.border}10`,alignItems:"center",transition:"background 0.15s"}}>
                  <div><div style={{fontSize:"0.75rem",fontWeight:600,color:C.text}}>{MONTHS_EN[r.month]}</div><div style={{fontSize:"0.58rem",color:C.muted}}>{r.year}</div></div>
                  <div style={{textAlign:"right",fontFamily:"monospace",fontSize:"0.7rem",color:r.bigWage>0?C.blue:C.muted}}>{r.bigWage>0?fmtEGP(r.bigWage):"—"}</div>
                  <div style={{textAlign:"right",fontFamily:"monospace",fontSize:"0.7rem",color:r.bigFund>0?C.green:C.muted}}>{r.bigFund>0?fmtEGP(r.bigFund):"—"}</div>
                  <div style={{textAlign:"right",fontFamily:"monospace",fontSize:"0.7rem",color:r.smallWage>0?C.blue:C.muted}}>{r.smallWage>0?fmtEGP(r.smallWage):"—"}</div>
                  <div style={{textAlign:"right",fontFamily:"monospace",fontSize:"0.7rem",color:r.smallFund>0?C.green:C.muted}}>{r.smallFund>0?fmtEGP(r.smallFund):"—"}</div>
                </div>
              ))}
            </div>)}

            {/* Yearly */}
            {activeTab==="yearly"&&(<div style={{padding:"0.9rem",display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(175px,1fr))",gap:"0.65rem",maxHeight:560,overflowY:"auto"}}>
              {uniqueYears.map((yr,i)=>{
                const yR=rows.filter(r=>r.year===yr);
                const lR=yR[yR.length-1];
                return(<div key={yr} style={{background:"#070b12",border:`1px solid ${C.border}`,borderRadius:12,padding:"0.9rem 1rem",animation:`fadeUp 0.4s ease both`,animationDelay:`${i*40}ms`}}>
                  <div style={{fontSize:"1rem",fontWeight:900,color:C.accent,marginBottom:"0.45rem"}}>{yr}</div>
                  <div style={{fontSize:"0.65rem",color:C.muted}}>End Balance</div>
                  <div style={{fontSize:"1.05rem",fontWeight:800,fontFamily:"monospace",color:C.text,marginBottom:"0.55rem"}}>{fmtEGP(lR.balance)}</div>
                  {[["Payouts in",fmtEGP(yR.reduce((s,r)=>s+r.totalIn,0)),C.blue],["Returns",fmtEGP(yR.reduce((s,r)=>s+r.returnAmt,0)),C.green],["💸 Withdrawn",fmtEGP(yR.reduce((s,r)=>s+r.returnWithdrawn,0)),C.accent],["Wages",fmtEGP(yR.reduce((s,r)=>s+r.bigWage+r.smallWage,0)),C.red],["Boost used",fmtEGP(yR.reduce((s,r)=>s+r.totalFundDrain,0)),C.purple],["Real value",fmtEGP(lR.realValue),C.sub]].map(([k,v,c])=>(
                    <div key={k} style={{display:"flex",justifyContent:"space-between",fontSize:"0.67rem",padding:"0.18rem 0",borderTop:`1px solid ${C.border}20`}}>
                      <span style={{color:C.muted}}>{k}</span><span style={{color:c,fontFamily:"monospace",fontWeight:600}}>{v}</span>
                    </div>
                  ))}
                </div>);
              })}
            </div>)}

            {/* Circles */}
            {activeTab==="circles"&&(<div style={{padding:"0.9rem",maxHeight:560,overflowY:"auto"}}>
              {[
                {title:"🔵 Big EGP Circle",color:C.blue,rows:[["Duration","6 months"],["Contribution","ج.م 2,000/mo"],["Slot","4th"],["Payout formula","Contribution × 5"],["Base payout","ج.م 10,000"],["Schedule","May·Jul·Sep·Nov·Jan·Mar"]]},
                {title:"🟢 Small EGP Circle",color:C.green,rows:[["Duration","6 months"],["Contribution","ج.م 1,000/mo"],["Slot","4th"],["Payout formula","Contribution × 5"],["Base payout","ج.م 5,000"],["Starts","May 2026"],["Schedule","Aug·Oct·Dec·Feb·Apr·Jun"]]},
                {title:"💵 USD Circle",color:C.accent,rows:[["Duration","10 months"],["Contribution","$200/mo"],["Payout",`$2,000 = ${fmtEGP(2000*usdRate)}`],["Circle 1","Jun 2026 (last slot)"],["Circle 2","Jul 2026 (first slot)"],["Pattern","Alternating first/last"]]},
              ].map(circle=>(<div key={circle.title} style={{background:"#070b12",border:`1px solid ${circle.color}22`,borderRadius:12,padding:"0.9rem 1.1rem",marginBottom:"0.65rem"}}>
                <div style={{fontWeight:800,fontSize:"0.88rem",color:circle.color,marginBottom:"0.65rem"}}>{circle.title}</div>
                {circle.rows.map(([k,v])=>(<div key={k} style={{display:"flex",justifyContent:"space-between",fontSize:"0.72rem",padding:"0.25rem 0",borderTop:`1px solid ${C.border}20`,gap:"0.8rem"}}>
                  <span style={{color:C.muted,flexShrink:0}}>{k}</span><span style={{color:C.text,fontWeight:600,textAlign:"right"}}>{v}</span>
                </div>))}
              </div>))}
            </div>)}

            {/* Goals */}
            {activeTab==="goals"&&(<div style={{padding:"0.9rem",maxHeight:560,overflowY:"auto"}}>
              <GoalsPanel
                rows={rows}
                annualReturn={annualReturn}
                bigBoostTimeline={bigBoostTimeline}
                smallBoostTimeline={smallBoostTimeline}
                inflation={inflation}
                goals={goals}
                onChange={setGoals}
                horizonMonths={horizon}
              />
            </div>)}

            {/* AI Insights */}
            {activeTab==="insights"&&(<div style={{maxHeight:580,overflowY:"auto"}}>
              <InsightsPanel
                fundBalance={last.balance||initialFund}
                annualReturn={annualReturn}
                usdRate={usdRate}
              />
            </div>)}
          </div>
        </div>

        <p style={{textAlign:"center",fontSize:"0.62rem",color:C.muted,marginTop:"1rem"}}>
          للأغراض التوضيحية فقط · Past performance does not guarantee future results
        </p>
      </div>
    </div>
  </>);
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
